<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireBlaze Shop</title>

    <meta name="google-adsense-account" content="ca-pub-5709038508572445">

    <style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg, #0f1115, #1a1a1a);
    color:#fff;
}

.back-btn { 
    display:inline-block; 
    margin:20px; 
    padding:8px 14px; 
    background:#2a2f3a; 
    color:#fff; 
    border-radius:8px; 
    text-decoration:none; 
}
.back-btn:hover { background:#3b82f6; }

.container { max-width:1000px; margin:auto; padding:10px; }
h1 { text-align:center; }

.ranks { 
    display:grid; 
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); 
    gap:20px; 
}

.rank-box { 
    background:#1f232b; 
    padding:15px; 
    border-radius:10px; 
    display:flex;
    flex-direction:column;
}

.rank-box img { width:100%; border-radius:8px; }
.rank-box h2 { text-align:center; color:#ffd700; }

.rank-box ul { list-style:none; padding:0; }
.rank-box ul li { margin:5px 0; }

.purchase-btn {
    margin-top:auto;
    padding:10px;
    background:#3b82f6;
    color:#fff;
    text-align:center;
    border-radius:6px;
    cursor:pointer;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#1f232b;
    padding:20px;
    border-radius:10px;
    width:320px;
    text-align:center;
    position:relative;
}

.close {
    position:absolute;
    right:10px;
    top:5px;
    cursor:pointer;
    font-size:22px;
}

.qr-img {
    width:100%;
    border-radius:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- BACK SAFE FIX -->
<a href="index.html" class="back-btn">← Back</a>

<div class="container">
<h1>FireBlaze Shop</h1>

<div class="ranks">

<div class="rank-box">
<img src="images/dirt.jpg">
<h2>Dirt Clan</h2>
<ul><li>₹29</li></ul>
<div class="purchase-btn" onclick="openQR('Dirt Clan')">Buy</div>
</div>

<div class="rank-box">
<img src="images/copper.jpg">
<h2>Copper Clan</h2>
<ul><li>₹59</li></ul>
<div class="purchase-btn" onclick="openQR('Copper Clan')">Buy</div>
</div>

<div class="rank-box">
<img src="images/iron.jpg">
<h2>Iron Clan</h2>
<ul><li>₹89</li></ul>
<div class="purchase-btn" onclick="openQR('Iron Clan')">Buy</div>
</div>

<div class="rank-box">
<img src="images/gold.jpg">
<h2>Gold Clan</h2>
<ul><li>₹159</li></ul>
<div class="purchase-btn" onclick="openQR('Gold Clan')">Buy</div>
</div>

<div class="rank-box">
<img src="images/diamond.jpg">
<h2>Diamond Clan</h2>
<ul><li>₹299</li></ul>
<div class="purchase-btn" onclick="openQR('Diamond Clan')">Buy</div>
</div>

<div class="rank-box">
<img src="images/netherite.jpg">
<h2>Netherite Clan</h2>
<ul><li>₹1999</li></ul>
<div class="purchase-btn" onclick="openQR('Netherite Clan')">Buy</div>
</div>

</div>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="modal" onclick="outsideClose(event)">
<div class="modal-content">

<span class="close" onclick="closeQR()">&times;</span>

<h2 id="rankName">Scan & Pay</h2>
<p>Pay using UPI app</p>

<!-- ⚠️ IMPORTANT: move QR to images folder -->
<img class="qr-img" src="images/qr.png">

</div>
</div>

<script>
function openQR(rank) {
    document.getElementById("qrModal").style.display = "flex";
    document.getElementById("rankName").innerText = rank + " Payment";
}

function closeQR() {
    document.getElementById("qrModal").style.display = "none";
}

/* click outside modal closes */
function outsideClose(e) {
    if(e.target.id === "qrModal") {
        closeQR();
    }
}

/* safe back */
document.querySelector(".back-btn").addEventListener("click", function(e){
    e.preventDefault();
    window.location.href = "index.html";
});
</script>

</body>
</html>
