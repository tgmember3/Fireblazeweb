<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Already Signed Up | Fire Blaze Verse</title>

<meta name="theme-color" content="#030303">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;
    background: #030303;

    overflow-x: hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

        linear-gradient(
            135deg,
            rgba(0,0,0,.95),
            rgba(45,12,0,.78),
            rgba(0,0,0,.98)
        ),

        url(
            "https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png"
        )
        center / cover no-repeat;

    filter:
        blur(3px)
        brightness(.62);

    transform:
        scale(1.06);

    z-index: -5;
}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(255,106,0,.18),
            transparent 45%
        ),

        linear-gradient(
            to bottom,
            rgba(0,0,0,.1),
            rgba(0,0,0,.95)
        );

    z-index: -4;

    pointer-events: none;
}


/* =========================
   PARTICLES
========================= */

#particles {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: -3;

    pointer-events: none;
}


/* =========================
   NAVBAR
========================= */

.navbar {

    position: sticky;

    top: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 17px 6%;

    background:
        rgba(5,5,5,.65);

    border-bottom:
        1px solid
        rgba(255,106,0,.16);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}


.logo {

    color: white;

    text-decoration: none;

    font-size: 21px;

    font-weight: 900;

    text-shadow:
        0 0 18px
        rgba(255,106,0,.7);
}


.back-link {

    color: #aaa;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    transition: .3s;
}


.back-link:hover {
    color: white;
}


/* =========================
   PAGE
========================= */

.page {

    min-height:
        calc(100vh - 75px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        50px 20px 70px;
}


/* =========================
   CARD
========================= */

.auth-card {

    width:
        min(430px, 100%);

    padding:
        38px 34px;

    text-align: center;

    border-radius:
        22px;

    background:

        linear-gradient(
            145deg,
            rgba(255,106,0,.09),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,106,0,.25);

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.65),

        0 0 45px
        rgba(255,106,0,.08);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    animation:
        cardIn .7s ease;
}


@keyframes cardIn {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   ICON
========================= */

.brand-mark {

    width: 68px;

    height: 68px;

    margin:
        0 auto 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius:
        18px;

    background:
        rgba(255,106,0,.08);

    border:
        1px solid
        rgba(255,106,0,.32);

    box-shadow:
        0 0 35px
        rgba(255,106,0,.12);
}


.brand-mark svg {

    width: 34px;
    height: 34px;
}


/* =========================
   TITLE
========================= */

h1 {

    margin: 0;

    font-size:
        clamp(28px, 7vw, 34px);

    font-weight: 900;

    letter-spacing:
        -.8px;

    background:

        linear-gradient(
            120deg,
            #ffffff,
            #ffbd83,
            #ff6a00
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;
}


/* =========================
   DESCRIPTION
========================= */

.description {

    margin:
        14px auto 25px;

    max-width:
        330px;

    color:
        #929292;

    font-size:
        13px;

    line-height:
        1.7;
}


/* =========================
   BUTTON
========================= */

.home-button {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-width:
        155px;

    height:
        46px;

    padding:
        0 24px;

    border-radius:
        10px;

    text-decoration:
        none;

    color:
        #080808;

    background:

        linear-gradient(
            135deg,
            #ff963f,
            #ff5b00
        );

    font-size:
        12px;

    font-weight:
        900;

    box-shadow:
        0 8px 28px
        rgba(255,106,0,.2);

    transition:
        .3s;
}


.home-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 35px
        rgba(255,106,0,.35);
}


/* =========================
   SIGN IN
========================= */

.signin-text {

    margin-top:
        20px;

    color:
        #777;

    font-size:
        12px;
}


.signin-text a {

    color:
        #ff7b20;

    text-decoration:
        none;

    font-weight:
        800;
}


.signin-text a:hover {

    color:
        #ff9a55;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

    .navbar {

        padding:
            14px 18px;
    }

    .logo {

        font-size:
            17px;
    }

    .back-link {

        font-size:
            11px;
    }

    .page {

        padding:
            35px 15px 55px;
    }

    .auth-card {

        padding:
            30px 20px;

        border-radius:
            18px;
    }

}

</style>

</head>


<body>


<canvas id="particles"></canvas>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        FBVerse
    </a>


    <a
        href="index.html"
        class="back-link"
    >
        Back to Home
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="page">


    <section class="auth-card">


        <!-- ICON -->

        <div class="brand-mark">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    d="M12 3C12 3 7.5 8.2 7.5 13.1C7.5 16.1 9.5 18 12 18C14.5 18 16.5 16.1 16.5 13.1C16.5 11.1 15.3 9.3 14.2 8.2C14.1 10.1 13.2 11.2 12.4 11.8C12.8 8.1 12 5.5 12 3Z"
                    fill="#FF6A00"
                />

                <path
                    d="M12 21C8.7 21 6 18.7 6 15.5C6 13.5 6.8 11.7 8 10.2C7.8 12.9 9.2 14.4 10.4 14.9C10.2 12.8 11.2 11.2 12.7 10.1C12.6 13.2 14.8 14 14.8 16C14.8 18.8 13.7 21 12 21Z"
                    fill="#FFB06A"
                />

            </svg>

        </div>


        <!-- TITLE -->

        <h1>
            Oh no!
        </h1>


        <!-- DESCRIPTION -->

        <p class="description">

            You have already signed up and
            are currently logged in.

        </p>


        <!-- HOME -->

        <a
            href="index.html"
            class="home-button"
        >
            Go to Home
        </a>


        <!-- SIGN IN -->

        <div class="signin-text">

            Want to use another account?

            <a href="signin.html">
                Sign In
            </a>

        </div>


    </section>


</main>


<!-- =========================
     PARTICLES
========================= -->

<script>

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let particles = [];


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


function createParticles() {

    particles = [];

    const amount =
        window.innerWidth < 600
        ? 35
        : 85;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x:
                Math.random()
                * canvas.width,

            y:
                Math.random()
                * canvas.height,

            r:
                Math.random()
                * 2 + .3,

            speed:
                Math.random()
                * .7 + .15,

            drift:
                (Math.random() - .5)
                * .25,

            opacity:
                Math.random()
                * .6 + .1

        });

    }

}


function drawParticles() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        p => {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    120,
                    30,
                    ${p.opacity}
                )`;


            ctx.shadowBlur =
                10;

            ctx.shadowColor =
                "rgba(255,90,0,.5)";


            ctx.fill();

            ctx.shadowBlur =
                0;


            p.y -=
                p.speed;

            p.x +=
                p.drift;


            if (p.y < -10) {

                p.y =
                    canvas.height + 10;

                p.x =
                    Math.random()
                    * canvas.width;

            }


            if (p.x < -10) {

                p.x =
                    canvas.width + 10;

            }


            if (
                p.x >
                canvas.width + 10
            ) {

                p.x =
                    -10;

            }

        }
    );


    requestAnimationFrame(
        drawParticles
    );

}


resizeCanvas();

createParticles();

drawParticles();


window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        createParticles();

    }
);

</script>


</body>

</html>
