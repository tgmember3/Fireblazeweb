<!DOCTYPE html>
<html>
<head>
  <title>Fire Blaze Verse</title>

  <!-- Google AdSense Verification -->
  <meta name="google-adsense-account" content="ca-pub-5709038508572445">

  <!-- Google AdSense Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5709038508572445"
     crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      overflow-x: hidden;
      background: black;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: url("https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png") no-repeat center/cover;
      background-size: 120%;
      filter: brightness(0.2) blur(2px);
      z-index: -2;
      transition: background 0.5s;
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 40px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }

    .logo {
      color: #ff6a00;
      font-weight: bold;
      font-size: 22px;
    }

    .nav-links a {
      margin-left: 20px;
      color: #ccc;
      text-decoration: none;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #ff6a00;
    }

    .hero {
      text-align: center;
      margin-top: 120px;
    }

    .hero h1 {
      font-size: 55px;
      color: #ff6a00;
      text-shadow: 0 0 20px rgba(255,106,0,0.7);
    }

    .hero p {
      color: #ddd;
      margin-bottom: 30px;
    }

    .ip-box {
      display: inline-block;
      padding: 20px 40px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      border: 1px solid #444;
      cursor: pointer;
      transition: 0.3s;
    }

    .ip-box:hover {
      border-color: #ff6a00;
      box-shadow: 0 0 20px rgba(255,106,0,0.5);
    }

    .ip {
      font-size: 18px;
      font-weight: bold;
    }

    .ip-box span {
      font-size: 12px;
      color: #aaa;
    }

    .hero-buttons {
      margin-top: 30px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      background: #ff6a00;
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #ff8533;
    }

    .popup {
      display: none;
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      top: 0;
    }

    .popup-content {
      background: #111;
      padding: 25px;
      width: 320px;
      margin: 150px auto;
      border-radius: 10px;
      border: 1px solid #333;
      text-align: center;
    }

    .popup-content h2 {
      color: #ff6a00;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 20px;
    }
  </style>
</head>
