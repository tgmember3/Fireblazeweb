<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sign In | Fire Blaze Verse</title>

<meta name="theme-color" content="#030303">


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup,
    OAuthProvider
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBzhoQQCioLMHSF1lqQLLRG39HqyPehYvc",

    authDomain:
        "fire-blaze-4cbab.firebaseapp.com",

    projectId:
        "fire-blaze-4cbab",

    storageBucket:
        "fire-blaze-4cbab.firebasestorage.app",

    messagingSenderId:
        "57715892228",

    appId:
        "1:57715892228:web:6fe89103777fd9231cd551"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================
   ELEMENTS
========================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const signinButton =
    document.getElementById("signinButton");

const message =
    document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "message " + type;

    message.classList.add("show");

}


function hideMessage() {

    message.classList.remove("show");

}


/* =========================
   CHECK LOGIN STATUS
========================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (user) {

            window.location.href =
                "ohno.html";

        }

    }
);


/* =========================
   EMAIL SIGN IN
========================= */

signinButton.addEventListener(
    "click",
    async () => {

        hideMessage();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email) {

            showMessage(
                "Please enter your email address."
            );

            return;

        }


        if (!password) {

            showMessage(
                "Please enter your password."
            );

            return;

        }


        signinButton.disabled =
            true;

        signinButton.innerHTML =
            '<span class="spinner"></span> Signing in...';


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            window.location.href =
                "index.html";


        } catch (error) {

            signinButton.disabled =
                false;

            signinButton.textContent =
                "Sign In";


            switch (error.code) {

                case "auth/invalid-credential":

                case "auth/wrong-password":

                case "auth/user-not-found":

                    showMessage(
                        "Incorrect email or password."
                    );

                    break;


                case "auth/invalid-email":

                    showMessage(
                        "Please enter a valid email address."
                    );

                    break;


                case "auth/too-many-requests":

                    showMessage(
                        "Too many attempts. Please try again later."
                    );

                    break;


                default:

                    showMessage(
                        "Unable to sign in. Please try again."
                    );

            }

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

document
    .getElementById("forgotPassword")
    .addEventListener(
        "click",
        async (event) => {

            event.preventDefault();

            hideMessage();

            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Enter your email address first."
                );

                emailInput.focus();

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset email sent. Check your inbox.",
                    "success"
                );


            } catch (error) {

                if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    showMessage(
                        "Please enter a valid email address."
                    );

                } else {

                    showMessage(
                        "Unable to send password reset email."
                    );

                }

            }

        }
    );


/* =========================
   GOOGLE
========================= */

const googleProvider =
    new GoogleAuthProvider();


document
    .getElementById("googleButton")
    .addEventListener(
        "click",
        async () => {

            hideMessage();

            try {

                await signInWithPopup(
                    auth,
                    googleProvider
                );


                window.location.href =
                    "index.html";


            } catch (error) {

                if (
                    error.code !==
                    "auth/popup-closed-by-user"
                ) {

                    showMessage(
                        "Google sign-in could not be completed."
                    );

                }

            }

        }
    );


/* =========================
   APPLE
========================= */

document
    .getElementById("appleButton")
    .addEventListener(
        "click",
        async () => {

            hideMessage();

            const provider =
                new OAuthProvider(
                    "apple.com"
                );


            try {

                await signInWithPopup(
                    auth,
                    provider
                );


                window.location.href =
                    "index.html";


            } catch (error) {

                showMessage(
                    "Apple Sign-In is not configured yet."
                );

            }

        }
    );


/* =========================
   GITHUB
========================= */

document
    .getElementById("githubButton")
    .addEventListener(
        "click",
        async () => {

            hideMessage();

            const provider =
                new OAuthProvider(
                    "github.com"
                );


            try {

                await signInWithPopup(
                    auth,
                    provider
                );


                window.location.href =
                    "index.html";


            } catch (error) {

                if (
                    error.code !==
                    "auth/popup-closed-by-user"
                ) {

                    showMessage(
                        "GitHub sign-in could not be completed."
                    );

                }

            }

        }
    );


/* =========================
   PHONE
========================= */

document
    .getElementById("phoneButton")
    .addEventListener(
        "click",
        () => {

            showMessage(
                "Phone authentication will be available after Phone Sign-In is configured in Firebase."
            );

        }
    );

</script>

/* =========================
   RESET
========================= */

}

/* =========================

}


body::after {

}


/* =========================
   PARTICLES
========================= */

#particles {

}


/* =========================
   NAVBAR
========================= */

.navbar {

.logo {

}


.back-link {

    transition: .3s;
}


.back-link:hover {
    color: white;
}


/* =========================
   PAGE
========================= */

.page {

        calc(100vh - 75px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding:

}


/* =========================
   AUTH CARD
========================= */

.auth-card {

    width:

    padding:

    border-radius:

    background:

        linear-gradient(

            rgba(255,255,255,.035)

    border:
        1px solid

    box-shadow:

        0 30px 90px

        0 0 45px
        rgba(255,106,0,.08);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    animation:
        cardIn .7s ease;
}


@keyframes cardIn {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   BRAND
========================= */

.brand-mark {

    width: 58px;

    height: 58px;

    margin:

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 17px;

    height: 30px;
}


/* =========================
   TITLE
========================= */

.auth-card h1 {

    text-align: center;

    font-size: 29px;

    letter-spacing: -.7px;

    font-weight: 900;

    background:

            120deg,
            #ffffff,
            #ffbd83,
            #ff6a00

    background-clip: text;

    color: transparent;
}


.subtitle {

    font-size: 13px;

    line-height: 1.6;
}


/* =========================
   MESSAGE
========================= */

.message {

    display: none;

    margin-bottom:

    border-radius:

    font-size:

    line-height:

    text-align: center;
}

}

.primary-button:disabled {

    transform: none;
}


/* =========================
   DIVIDER
========================= */

.divider {

    display: flex;

    align-items: center;

    gap: 12px;

    margin:
        23px 0 17px;

    font-size: 10px;

    font-weight: 800;

.divider::before,

            18px;

    }

        font-size: 25px;
    }

}

</style>

</head>

     PARTICLES
========================= -->

<script>

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");

let particles = [];


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


function createParticles() {

    particles = [];

    const amount =
        window.innerWidth < 600
        ? 35
        : 85;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x:
                Math.random()
                * canvas.width,

            y:
                Math.random()
                * canvas.height,

            r:
                Math.random()
                * 2 + .3,

            speed:
                Math.random()
                * .7 + .15,

            drift:
                (Math.random() - .5)
                * .25,

            opacity:
                Math.random()
                * .6 + .1

        });

    }

}


function drawParticles() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        p => {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    120,
                    30,
                    ${p.opacity}
                )`;


            ctx.shadowBlur = 10;

            ctx.shadowColor =
                "rgba(255,90,0,.5)";

            ctx.fill();

            ctx.shadowBlur = 0;


            p.y -= p.speed;

            p.x += p.drift;


            if (p.y < -10) {

                p.y =
                    canvas.height + 10;

                p.x =
                    Math.random()
                    * canvas.width;

            }


            if (p.x < -10) {

                p.x =
                    canvas.width + 10;

            }


            if (
                p.x >
                canvas.width + 10
            ) {

                p.x = -10;

            }

        }
    );


    requestAnimationFrame(
        drawParticles
    );

}


resizeCanvas();

createParticles();

drawParticles();


window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        createParticles();

    }
);

</script>


</body>
